{% with current_section=active_work_section|default:"" %}
<section class="relative z-20 border-b border-slate-200 bg-gradient-to-r from-orange-50 via-white to-emerald-50 shadow-xs">
    <div class="container-shell mx-auto max-w-7xl px-4 sm:px-6 lg:px-8 py-1.5">
        <nav
            aria-label="Our Work navigation"
            class="flex items-center justify-center gap-2 sm:gap-2.5 overflow-x-auto no-scrollbar py-0.5"
        >
            <!-- Our Projects -->
            <a
                href="{% url 'projects:project_list' %}"
                class="group inline-flex shrink-0 items-center gap-2 rounded-lg border px-3 py-1.5 text-xs font-semibold shadow-xs transition duration-200 hover:shadow-sm
                {% if current_section == 'projects' %}
                    border-orange-300 bg-orange-50 text-slate-900 ring-1 ring-orange-200
                {% else %}
                    border-slate-200 bg-white text-slate-700 hover:border-orange-300 hover:text-slate-900
                {% endif %}"
                {% if current_section == 'projects' %}aria-current="page"{% endif %}
            >
                <span class="flex h-6 w-6 shrink-0 items-center justify-center rounded-md bg-orange-100 text-orange-700 transition group-hover:bg-orange-200">
                    <svg class="h-3.5 w-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
                        <rect x="3" y="4" width="18" height="16" rx="2"/>
                        <path stroke-linecap="round" d="M8 8h8M8 12h5M8 16h8"/>
                    </svg>
                </span>

                <span class="whitespace-nowrap leading-none">Our Projects</span>

                <span class="ml-0.5 text-xs text-orange-500 opacity-70 transition group-hover:translate-x-0.5" aria-hidden="true">→</span>
            </a>

            <!-- Our Impact -->
            <a
                href="{% url 'projects:our_impact' %}"
                class="group inline-flex shrink-0 items-center gap-2 rounded-lg border px-3 py-1.5 text-xs font-semibold shadow-xs transition duration-200 hover:shadow-sm
                {% if current_section == 'impact' %}
                    border-orange-300 bg-orange-50 text-slate-900 ring-1 ring-orange-200
                {% else %}
                    border-slate-200 bg-white text-slate-700 hover:border-orange-300 hover:text-slate-900
                {% endif %}"
                {% if current_section == 'impact' %}aria-current="page"{% endif %}
            >
                <span class="flex h-6 w-6 shrink-0 items-center justify-center rounded-md bg-emerald-100 text-emerald-800 transition group-hover:bg-emerald-200">
                    <svg class="h-3.5 w-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M4 19V5m0 14h17M8 15v-4m5 4V7m5 8V9"/>
                    </svg>
                </span>

                <span class="whitespace-nowrap leading-none">Our Impact</span>

                <span class="ml-0.5 text-xs text-orange-500 opacity-70 transition group-hover:translate-x-0.5" aria-hidden="true">→</span>
            </a>
        </nav>
    </div>
</section>
{% endwith %}
